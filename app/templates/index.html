{% extends "base.html" %}
{% block title %}Red Hat Casino{% endblock %}
{% block body %}
<div class="page">
  <main class="casino">
    <section class="machine" aria-label="Slot machine">
      <div class="machine__top">
        <div class="header__brand">
          <span class="header__logo" aria-hidden="true"></span>
          <h1>Red Hat Casino</h1>
        </div>
        <div class="machine__lights" aria-hidden="true">
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="machine__window">
        <div class="reels" id="reels">
          {% for i in range(5) %}
          <div class="reel" data-reel="{{ i }}">
            <div class="reel__strip">
              <div class="reel__symbol" data-symbol="golf_ball"></div>
            </div>
          </div>
          {% endfor %}
        </div>
      </div>

      <div class="machine__controls">
        <form id="player-form" class="player-form">
          <h2 class="player-form__title">Enter to play</h2>
          <p class="player-form__subtitle">One spin per email address.</p>
          <div class="player-form__fields">
            <label>
              <span>First name</span>
              <input name="first_name" type="text" required autocomplete="given-name">
            </label>
            <label>
              <span>Last name</span>
              <input name="last_name" type="text" required autocomplete="family-name">
            </label>
            <label>
              <span>Email</span>
              <input name="email" type="email" required autocomplete="email">
            </label>
          </div>
          <p class="form-error" id="form-error" hidden></p>
          <button class="btn btn--primary" id="spin-btn" type="submit" disabled>Pull to Spin</button>
        </form>
      </div>
    </section>
  </main>

  <div class="result-banner" id="result-banner" hidden>
    <div class="result-banner__content">
      <p id="result-message"></p>
      <button class="btn btn--ghost" id="result-close" type="button">Close</button>
    </div>
  </div>
</div>

<script>
  window.SLOT_SYMBOLS = {{ symbols | tojson }};
</script>
<script src="/static/js/icons.js"></script>
<script src="/static/js/app.js"></script>
{% endblock %}
